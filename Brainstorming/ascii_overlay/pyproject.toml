[project]
name = "ascii_overlay"
version = "0.1.0"
description = "Always-on-top Windows lens that redraws what lies under it as black and white ASCII, up to 20 times a second."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "pillow>=10",
    "mss>=9",
    "dxcam>=0.0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ascii-overlay = "ascii_overlay.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ascii_overlay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
