[project]
name = "dspyer"
version = "0.1.0"
description = "Prompt & model optimization API: pulls a Langfuse prompt, dataset and evaluators, then runs improvement loops (DSPy, OPRO, Chain-of-Density, few-shot) to maximize eval scores."
readme = "readme.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langfuse>=2.60",
    "litellm>=1.60",
    "dspy>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.scripts]
dspyer-serve = "dspyer.main:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dspyer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true
