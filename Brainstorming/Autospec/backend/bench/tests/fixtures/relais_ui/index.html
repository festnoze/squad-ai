<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relais Support (bouchon du banc)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #fff; color: #111; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #999; }
  main { padding: 12px; }
  h1, p, li, .title { overflow-wrap: anywhere; }
  :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
  label { display: block; margin-top: 8px; }
  input, textarea, select { max-width: 100%; box-sizing: border-box; }
  [role=dialog] { position: fixed; inset: 5%; background: #fff; border: 2px solid #333; padding: 12px; overflow: auto; }
  /* Defects, switched on by the tests through DEFECTS (one class per defect on <html>). */
  html.no-focus-style *:focus, html.no-focus-style *:focus-visible { outline: none !important; box-shadow: none !important; }
  html.overflow .title { white-space: nowrap; overflow-wrap: normal; }
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const DEFECTS = new Set(/*DEFECTS*/[]);
document.documentElement.classList.add(...DEFECTS);
const TIMEOUT_MS = 3000;  // well under the 15 s maximum of the specification: keeps the tests fast
const STATUS = { open: "Ouvert", in_progress: "En cours", resolved: "Résolu", closed: "Fermé" };
const PRIORITY = { low: "Basse", normal: "Normale", high: "Haute" };
const PROPERTIES = new Set(["htmlFor", "value", "disabled", "selected"]);
const state = { user: null, csrf: "", drafts: {}, cache: {} };
const root = document.getElementById("root");
let listSeq = 0;

function h(tag, props = {}, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value === undefined || value === null || value === false) continue;
    if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
    else if (PROPERTIES.has(key)) el[key] = value;
    else el.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat()) if (child !== null && child !== undefined && child !== "") el.append(child);
  return el;
}

class NetworkError extends Error {}

async function api(method, path, body) {
  const controller = new AbortController();
  const timer = DEFECTS.has("no-timeout") ? null : setTimeout(() => controller.abort(), TIMEOUT_MS);
  const headers = { Accept: "application/json" };
  if (body !== undefined) headers["Content-Type"] = "application/json";
  if (method !== "GET" && state.csrf) headers["X-CSRF-Token"] = state.csrf;
  let response;
  try {
    response = await fetch(path, { method, headers, signal: controller.signal,
                                   body: body === undefined ? undefined : JSON.stringify(body) });
  } catch (error) {
    throw new NetworkError(String(error));
  } finally {
    if (timer) clearTimeout(timer);
  }
  const data = response.status === 204 ? null : await response.json().catch(() => null);
  if (response.status === 401 && state.user) {  // the session died: private state goes, login comes back
    forget();
    renderLogin("Session expirée : reconnectez-vous.");
    throw new NetworkError("401");
  }
  return { status: response.status, data };
}

function go(next) {
  const query = new URLSearchParams();
  for (const [key, value] of Object.entries(next)) if (value !== undefined && value !== null && value !== "") query.set(key, value);
  const text = query.toString();
  history.pushState(null, "", text ? `/?${text}` : "/");
  route();
}
const link = (target) => (event) => { event.preventDefault(); go(target); };
window.addEventListener("popstate", () => route());

function route() {
  if (!state.user) return renderLogin();
  const params = new URLSearchParams(location.search);
  const main = shell();
  const view = params.get("view") || "tickets";
  if (view === "ticket") renderDetail(main, params.get("id"));
  else if (view === "users") renderUsers(main);
  else renderList(main, params);
}

function forget() {
  state.user = null;
  state.csrf = "";
  if (!DEFECTS.has("keep-cache")) { state.drafts = {}; state.cache = {}; }
  document.querySelectorAll("[role=dialog]").forEach((dialog) => dialog.remove());
}

async function logout() {
  try { await api("POST", "/api/auth/logout"); } catch (error) { /* the local state goes anyway */ }
  forget();
  history.replaceState(null, "", "/");
  renderLogin();
}

function renderLogin(notice) {
  const email = h("input", { id: "email", type: "email", autocomplete: "username" });
  const password = h("input", { id: "password", type: "password", autocomplete: "current-password" });
  const error = h("p", { id: "login-error", role: "alert" });
  const submit = h("button", { type: "submit" }, "Se connecter");
  async function onSubmit(event) {
    event.preventDefault();
    submit.disabled = true;
    error.textContent = "";
    try {
      const r = await api("POST", "/api/auth/login", { email: email.value, password: password.value });
      if (r.status === 200) { state.user = r.data.user; state.csrf = r.data.csrf_token; route(); return; }
      error.textContent = "Identifiants invalides.";
    } catch (e) {
      error.textContent = "Serveur injoignable, réessayez.";
    }
    submit.disabled = false;
  }
  root.replaceChildren(h("main", {}, h("h1", {}, "Relais Support"),
    h("form", { "aria-label": "Connexion", novalidate: true, onsubmit: onSubmit },
      notice ? h("p", { role: "status" }, notice) : "", error,
      h("label", { htmlFor: "email" }, "Adresse e-mail"), email,
      h("label", { htmlFor: "password" }, "Mot de passe"), password, submit)));
}

function shell() {
  const staff = state.user.role !== "client";
  const main = h("main", { id: "view" });
  root.replaceChildren(
    h("header", {},
      h("strong", {}, "Relais Support"),
      h("nav", { "aria-label": "Navigation principale" },
        h("a", { href: "/?view=tickets", onclick: link({ view: "tickets" }) }, staff ? "File d'équipe" : "Mes tickets"),
        " ",
        state.user.role === "admin" ? h("a", { href: "/?view=users", onclick: link({ view: "users" }) }, "Comptes") : ""),
      h("span", {}, state.user.display_name),
      h("button", { type: "button", onclick: logout }, "Se déconnecter")),
    main);
  return main;
}

function renderList(main, params) {
  const staff = state.user.role !== "client";
  const q = params.get("q") || "";
  const page = Math.max(1, parseInt(params.get("page") || "1", 10) || 1);
  const search = h("input", { id: "q", type: "search", value: q });
  main.append(
    h("h1", {}, staff ? "File d'équipe" : "Mes tickets"),
    staff ? "" : h("button", { type: "button", onclick: openCreate }, "Nouveau ticket"),
    h("div", { id: "notice", role: "status" }),
    h("form", { role: "search", onsubmit: (event) => { event.preventDefault(); go({ view: "tickets", q: search.value.trim() }); } },
      h("label", { htmlFor: "q" }, "Recherche"), search, h("button", { type: "submit" }, "Rechercher")),
    h("div", { id: "list-state" }),
    h("ul", { id: "tickets" }),
    h("nav", { id: "pager", "aria-label": "Pagination" }));
  if (DEFECTS.has("keep-cache") && state.cache.list) paint(state.cache.list, q, page);
  loadList(q, page);
}

async function loadList(q, page) {
  const seq = ++listSeq;
  document.getElementById("list-state")?.replaceChildren(h("p", { role: "status" }, "Chargement des tickets…"));
  let r = null;
  try { r = await api("GET", "/api/tickets?" + new URLSearchParams({ q, page, page_size: 20 })); } catch (error) { r = null; }
  if (seq !== listSeq && !DEFECTS.has("no-stale-guard")) return;  // an older answer never replaces the current one
  if (!r || r.status !== 200) {
    document.getElementById("list-state")?.replaceChildren(h("div", { role: "alert" },
      h("p", {}, "Impossible de charger les tickets."),
      h("button", { type: "button", onclick: () => loadList(q, page) }, "Réessayer")));
    return;
  }
  state.cache.list = r.data;
  paint(r.data, q, page);
}

function paint(data, q, page) {
  const list = document.getElementById("tickets");
  if (!list) return;
  document.getElementById("list-state").replaceChildren(data.items.length ? "" : h("p", {}, "Aucun ticket pour le moment."));
  list.replaceChildren(...data.items.map((t) => h("li", {},
    h("a", { class: "title", href: `/?view=ticket&id=${t.id}`, onclick: link({ view: "ticket", id: t.id }) }, t.title),
    ` - ${STATUS[t.status]}`)));
  const pages = Math.max(1, Math.ceil(data.total / data.page_size));
  document.getElementById("pager").replaceChildren(
    h("button", { type: "button", disabled: page <= 1, onclick: () => go({ view: "tickets", q, page: page - 1 }) }, "Précédent"),
    ` Page ${page} sur ${pages} `,
    h("button", { type: "button", disabled: page >= pages, onclick: () => go({ view: "tickets", q, page: page + 1 }) }, "Suivant"));
}

function openCreate(event) {
  const opener = event.currentTarget;
  const title = h("input", { id: "nt-title", value: state.drafts.title || "", oninput: () => { state.drafts.title = title.value; } });
  const description = h("textarea", { id: "nt-description", rows: 5, value: state.drafts.description || "",
                                       oninput: () => { state.drafts.description = description.value; } });
  const titleError = h("p", { id: "nt-title-error" });
  const error = h("p", { role: "alert" });
  const submit = h("button", { type: "submit" }, "Créer le ticket");
  let attempt = null;  // one client_request_id per draft: a retry of the same payload reuses it

  async function onSubmit(event) {
    event.preventDefault();
    const payload = { title: title.value.trim(), description: description.value.trim() };
    const signature = JSON.stringify(payload);
    if (DEFECTS.has("new-uuid") || !attempt || attempt.signature !== signature) attempt = { signature, id: crypto.randomUUID() };
    submit.disabled = true;
    error.textContent = "";
    title.removeAttribute("aria-invalid");
    titleError.textContent = "";
    let r;
    try {
      r = await api("POST", "/api/tickets", { ...payload, client_request_id: attempt.id });
    } catch (e) {
      error.textContent = "Réseau indisponible : le brouillon est conservé, renvoyez-le.";
      submit.disabled = false;
      return;
    }
    submit.disabled = false;
    if (r.status === 200 || r.status === 201) {
      state.drafts = {};
      close();
      if (!DEFECTS.has("no-feedback")) {
        go({ view: "tickets" });
        document.getElementById("notice")?.replaceChildren(`Ticket « ${payload.title} » créé.`);
      }
      return;
    }
    if (r.status === 422 && r.data?.error?.fields?.title) {
      title.setAttribute("aria-invalid", "true");
      title.setAttribute("aria-describedby", "nt-title-error");
      titleError.textContent = r.data.error.fields.title;
    }
    error.textContent = r.data?.error?.message || "Création impossible.";
  }

  const dialog = h("div", { role: "dialog", "aria-modal": "true", "aria-labelledby": "nt-heading" },
    h("h2", { id: "nt-heading" }, "Nouveau ticket"),
    h("form", { novalidate: true, onsubmit: onSubmit }, error,
      h("label", { htmlFor: "nt-title" }, "Titre"), title, titleError,
      h("label", { htmlFor: "nt-description" }, "Description"), description,
      submit, " ", h("button", { type: "button", onclick: () => close() }, "Annuler")));
  dialog.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); close(); return; }
    if (e.key !== "Tab") return;
    const items = [...dialog.querySelectorAll("input, textarea, button")].filter((el) => !el.disabled);
    const [first, last] = [items[0], items[items.length - 1]];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  function close() {
    dialog.remove();
    if (opener.isConnected) opener.focus();
  }
  document.body.append(dialog);
  title.focus();
}

async function renderDetail(main, id) {
  main.replaceChildren(h("p", { role: "status" }, "Chargement du ticket…"));
  let r;
  try { r = await api("GET", `/api/tickets/${id}`); } catch (error) { return; }
  if (r.status !== 200) { main.replaceChildren(h("p", { role: "alert" }, "Ticket introuvable.")); return; }
  try { await api("GET", `/api/tickets/${id}/messages`); } catch (error) { return; }
  let ticket = r.data;
  const staff = state.user.role !== "client";

  function priorityForm() {
    const select = h("select", { id: "priority" },
      ...Object.entries(PRIORITY).map(([value, label]) => h("option", { value, selected: value === ticket.priority }, label)));
    const box = h("div", { id: "priority-state" });
    async function save(event) {
      event?.preventDefault();
      let p;
      try { p = await api("PATCH", `/api/tickets/${id}`, { expected_version: ticket.version, priority: select.value }); }
      catch (error) { box.replaceChildren(h("p", { role: "alert" }, "Réseau indisponible.")); return; }
      if (p.status === 200) { ticket = p.data; box.replaceChildren(h("p", { role: "status" }, "Priorité enregistrée.")); return; }
      if (p.status === 409) {
        if (DEFECTS.has("auto-reapply")) {  // the defect: silently overwrite the other change
          ticket = (await api("GET", `/api/tickets/${id}`)).data;
          return save();
        }
        box.replaceChildren(h("p", { role: "alert" }, "Ce ticket a été modifié entre-temps. Votre choix est conservé."),
          h("button", { type: "button", onclick: reload }, "Recharger le ticket"));
        return;
      }
      box.replaceChildren(h("p", { role: "alert" }, "Modification impossible."));
    }
    async function reload() {
      const fresh = await api("GET", `/api/tickets/${id}`);
      if (fresh.status === 200) {
        ticket = fresh.data;
        box.replaceChildren(h("p", { role: "status" }, "Ticket rechargé : vérifiez puis enregistrez votre choix."));
      }
    }
    return h("form", { onsubmit: save }, h("label", { htmlFor: "priority" }, "Priorité"), select, " ",
             h("button", { type: "submit" }, "Enregistrer"), box);
  }

  main.replaceChildren(
    h("p", {}, h("a", { href: "/?view=tickets", onclick: link({ view: "tickets" }) }, "Retour aux tickets")),
    h("h1", { class: "title" }, ticket.title),
    h("p", {}, ticket.description),
    h("p", {}, `Statut : ${STATUS[ticket.status]}`),
    staff ? priorityForm() : h("p", {}, `Priorité : ${PRIORITY[ticket.priority]}`));
}

async function renderUsers(main) {
  main.replaceChildren(h("h1", {}, "Comptes"), h("div", { id: "users" }, h("p", { role: "status" }, "Chargement des comptes…")));
  if (DEFECTS.has("keep-cache") && state.cache.users) paintUsers(state.cache.users);
  let r;
  try { r = await api("GET", "/api/users?page_size=50"); } catch (error) { return; }
  if (r.status !== 200) { document.getElementById("users")?.replaceChildren(h("p", { role: "alert" }, "Accès refusé.")); return; }
  state.cache.users = r.data;
  paintUsers(r.data);
}

function paintUsers(data) {
  document.getElementById("users")?.replaceChildren(h("ul", {},
    ...data.items.map((u) => h("li", {}, `${u.display_name} (${u.email}, ${u.role})`))));
}

(async () => {
  try {
    const r = await api("GET", "/api/auth/me");
    if (r.status === 200) { state.user = r.data.user; state.csrf = r.data.csrf_token; }
  } catch (error) { /* stay on the login view */ }
  route();
})();
</script>
</body>
</html>
