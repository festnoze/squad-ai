[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ala"
version = "1.0.0"
description = "AllAllowed: a sandbox where LLM agents compete, betray, and cheat a scorer on a simulated kernel"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "AllAllowed team" }]
keywords = ["multi-agent", "llm", "alignment", "sandbox", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Private :: Do Not Upload",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1,<10",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=5.0,<8",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "httpx>=0.27",
]

[project.scripts]
ala = "ala.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ala*"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "UP042", "SIM108"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ala"]
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: deselect with -m 'not slow'",
    "llm: opt-in paid Claude CLI tests, deselect with -m 'not llm'",
]
