name: ci

# WBS T1.1 exit gate: "make test vert en CI ; lint + typage ; couverture publiee".
# Owner A01. Every step maps to one Makefile target so a contributor can
# reproduce a red CI run with a single local command.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"
  # PYTHONHASHSEED is deliberately left unset so every job runs under a
  # randomised hash seed. CONTRACTS section 3.2 bans hash() from the engine
  # precisely so that this is safe, and an accidental hash() dependency shows
  # up here as a flaky determinism job instead of a silent divergence.

jobs:
  # ---------------------------------------------------------------------------
  # Quality gate: lint, format, types, and the dash ban. Linux only, fast.
  # ---------------------------------------------------------------------------
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: make lint PY=python
      - name: Format check
        run: make format-check PY=python
      - name: Typecheck
        run: make typecheck PY=python
      - name: Forbidden dash character in produced content
        # Contract rule 4 (U+2014). A repository wide scan is the only
        # enforcement that scales to twenty-five workstreams. Two kinds of file
        # are exempt because they are INPUTS and not produced content: the
        # French PRD and the frozen adversarial reviews under docs/reviews/.
        # The character is built with chr() so this workflow never trips itself.
        run: python -m pytest -q tests/test_style_rules.py

  # ---------------------------------------------------------------------------
  # The suite, on both platforms. Windows is first class: it is the primary
  # development platform here and it is where the journal newline trap of
  # CONTRACTS section 4.2 actually bites.
  # ---------------------------------------------------------------------------
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Fast suite
        run: python -m pytest -q -m "not llm and not slow and not statistical"
      - name: Determinism guards, never skipped (AC-P1)
        run: python -m pytest -q -m determinism

  # ---------------------------------------------------------------------------
  # Cross platform journal hash equality. This is the AC-P1 "two machines"
  # clause and the only job that can catch it: the two runners publish the hash
  # of the same reference scenario as an artefact.
  # Prints a clear message and stays green until A23 lands `pxe.cli`.
  # ---------------------------------------------------------------------------
  determinism-cross-platform:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Journal hash of the reference scenario
        shell: bash
        run: |
          if python -c "import pxe.cli" 2>/dev/null; then
            python -m pxe.cli match verify --template election --seed 20260827 --repeat 2 | tee "hash-${{ matrix.os }}.txt"
          else
            echo "pxe.cli is not landed yet (A23); nothing to compare." | tee "hash-${{ matrix.os }}.txt"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: journal-hash-${{ matrix.os }}
          path: hash-${{ matrix.os }}.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Coverage is published as an artefact, which is the literal T1.1 wording
  # ("couverture publiee"). Slow and statistical tests run here and nowhere
  # else, so the fast job stays fast.
  # ---------------------------------------------------------------------------
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Coverage over everything except the LLM tests
        run: python -m pytest -m "not llm" --cov=pxe --cov-report=term-missing --cov-report=xml --cov-report=html
      - name: Publish coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
      - name: Coverage summary in the job log
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # The web UI (A24). Stays green until web/package.json exists, then turns on
  # by itself.
  # ---------------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: probe
        shell: bash
        run: |
          if [ -f web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.probe.outputs.present == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, typecheck, test, build
        if: steps.probe.outputs.present == 'true'
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run test -- --run
          npm run build
      - name: Nothing to do
        if: steps.probe.outputs.present != 'true'
        run: echo "web/ is not landed yet (A24)."
