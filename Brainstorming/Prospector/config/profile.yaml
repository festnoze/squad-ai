# Hard geo/language rules — violations are eliminatory in scoring.
geo_rules:
  fr:                      # apply in FRENCH when...
    mission_country: [France]
  en:                      # apply in ENGLISH when...
    mission_country: [UK, USA, Ireland, Canada, Australia, New Zealand,
                      Netherlands, Germany, Switzerland, Nordics, Remote-worldwide]
    note: "Any country is fine if the working environment is English-speaking."
  remote: full_remote_only        # hybrid/on-site → eliminatory
  exceptions: "Occasional on-site kickoffs acceptable if mission is France (TGV: Montpellier/Paris/Strasbourg)."

engagement:
  wanted: [freelance, contract, mission, "contract-to-hire (contract phase)"]
  excluded: [permanent, CDI, internship, part-time under 3 days/week]
  availability: "See CPIR calendar — commercial start Oct 2026 (optimistic) / early 2027 (prudent). Mention availability honestly in letters when asked."

red_flags:                 # each subtracts score; 'eliminatory: true' kills the mission
  - { pattern: "on-site / hybrid mandatory",          eliminatory: true }
  - { pattern: "permanent position only (CDI)",       eliminatory: true }
  - { pattern: "TJM under min_acceptable",            eliminatory: false, penalty: 0.3 }
  - { pattern: "staffing spam / mass-posted offer",   eliminatory: false, penalty: 0.2 }
  - { pattern: "pure data-science/classic-ML with no GenAI", eliminatory: false, penalty: 0.2 }
  - { pattern: "junior/mid-level rate or expectations", eliminatory: false, penalty: 0.2 }
